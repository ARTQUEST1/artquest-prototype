<!DOCTYPE html>
<html>
<head>
<title>ARTQUEST</title>
<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}

h1{
margin-top:40px;
font-size:48px;
color:red;
}

#player{
width:40px;
height:40px;
background:red;
position:absolute;
top:300px;
left:300px;
border-radius:10px;
}
</style>
</head>

<body>

<h1>ARTQUEST</h1>

<div id="player"></div>

<script>

let player = document.getElementById("player");

let x = 300;
let y = 300;

document.addEventListener("keydown", function(e){

if(e.key=="ArrowRight"){x+=10;}
if(e.key=="ArrowLeft"){x-=10;}
if(e.key=="ArrowUp"){y-=10;}
if(e.key=="ArrowDown"){y+=10;}

player.style.left = x + "px";
player.style.top = y + "px";

});

</script>

</body>
</html>
