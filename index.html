

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ARTQUEST — Eggs in Paris</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
<style>
html, body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#050000;
  touch-action:none;
  font-family:Arial, sans-serif;
}
canvas{ display:block; }
</style>
</head>
<body>
<script>
const config = {
  type: Phaser.AUTO,
  width: window.innerWidth,
  height: window.innerHeight,
  backgroundColor: '#050000',
  physics:{
    default:'arcade',
    arcade:{ debug:false }
  },
  scene:{ preload, create, update }
};
const game = new Phaser.Game(config);
let level = 1;
let score = 0;
let ratScore = 0;
let ostrich;
let eggs = [];
let rats = [];
let bullets = [];
let blocks = [];
let fallingEggs = [];
let targetX = null;
let targetY = null;
let scoreText, levelText, missionText, modeText;
let shootButton, shootLabel;
let levelOverlay = null;
let lastShot = 0;
let lastFallingEgg = 0;
let lastBlock = 0;
let gamePaused = false;
let audioReady = false;
let sceneRef;
const eggTypes = [
  {name:'Quail', points:10, color:0xf6e7b8, size:0.75},
  {name:'Pigeon', points:15, color:0xd6e7ff, size:0.78},
  {name:'Duck', points:20, color:0xfff1c2, size:0.9},
  {name:'Goose', points:20, color:0xffffff, size:1.0},
  {name:'Chicken', points:25, color:0xfff5dd, size:0.88},
  {name:'Pheasant', points:30, color:0xd98b3a, size:0.82},
  {name:'Turkey', points:35, color:0xc9b08a, size:1.05},
  {name:'Guinea', points:40, color:0xb6d7ff, size:0.82},
  {name:'Emu', points:45, color:0x1f7a6b, size:1.22},
  {name:'Ostrich', points:50, color:0xffdf9e, size:1.45},
  {name:'Turtle', points:55, color:0x7ed957, size:1.15},
  {name:'Snake', points:-30, color:0x33ff44, size:0.92, danger:true},
  {name:'Dino', points:-50, color:0xff3333, size:1.3, danger:true},
  {name:'Rotten', points:-40, color:0x5b3b12, size:0.95, danger:true},
  {name:'Empty', points:-5, color:0x999999, size:0.8}
];
function preload(){}
function create(){
  sceneRef = this;
  createTextures.call(this);
  startLevel.call(this);
}
function startLevel(){
  const w = this.scale.width;
  const h = this.scale.height;
  gamePaused = false;
  targetX = null;
  targetY = null;
  eggs = [];
  rats = [];
  bullets = [];
  blocks = [];
  fallingEggs = [];
  this.children.removeAll();
  const underground = level % 3 === 0;
  if(underground){
    createUndergroundBackground.call(this,w,h);
  }else{
    createParisBackground.call(this,w,h);
  }
  createUI.call(this,w,h,underground);
  createOstrich.call(this,w,h);
  createEggs.call(this,w,h,underground);
  createRatGang.call(this,w,h);
  createShootButton.call(this,w,h);
  this.input.off('pointerdown');
  this.input.off('pointermove');
  this.input.on('pointerdown', pointer => {
    unlockAudio();
    if(pointer.x > w - 170 && pointer.y > h - 120){
      shoot.call(this);
      return;
    }
    targetX = pointer.x;
    targetY = pointer.y;
  });
  this.input.on('pointermove', pointer => {
    if(pointer.isDown){
      if(pointer.x > w - 170 && pointer.y > h - 120){ return; }
      targetX = pointer.x;
      targetY = pointer.y;
    }
  });
}
function createTextures(){
  let g = this.add.graphics();
  // OSTRICH
  g.clear();
  g.fillStyle(0xffffff,1);
  g.fillEllipse(55,88,58,78);
  g.fillStyle(0x111111,1);
  g.fillRect(28,70,54,36);
  g.fillStyle(0x00aa55,1);
  g.fillRect(22,73,66,28);
  g.lineStyle(2,0x001a10,1);
  for(let i=0;i<5;i++){ g.lineBetween(25+i*12,73,25+i*12,101); }
  for(let i=0;i<3;i++){ g.lineBetween(22,78+i*9,88,78+i*9); }
  g.fillStyle(0xffffff,1);
  g.fillRect(48,25,14,55);
  g.fillEllipse(55,22,42,32);
  g.lineStyle(5,0xffffff,1);
  g.lineBetween(42,122,28,148);
  g.lineBetween(66,122,80,148);
  g.fillStyle(0xffcc66,1);
  g.fillTriangle(62,22,92,28,62,34);
  g.lineStyle(5,0x000000,1);
  g.strokeCircle(45,19,10);
  g.strokeCircle(65,19,10);
  g.lineBetween(55,19,55,19);
  g.fillStyle(0x000000,1);
  g.fillCircle(45,19,3);
  g.fillCircle(65,19,3);
  g.fillStyle(0x000000,1);
  g.fillEllipse(55,65,22,9);
  g.generateTexture('ostrich',110,155);
  // RAT
  g.clear();
  g.fillStyle(0x7b1e1e,1);
  g.fillEllipse(44,42,62,38);
  g.fillStyle(0xff3333,1);
  g.fillCircle(18,25,14);
  g.fillCircle(70,25,14);
  g.fillStyle(0xffa6a6,1);
  g.fillCircle(18,25,7);
  g.fillCircle(70,25,7);
  g.fillStyle(0xff4444,1);
  g.fillEllipse(44,36,38,24);
  g.fillStyle(0x111111,1);
  g.fillCircle(34,34,5);
  g.fillCircle(54,34,5);
  g.fillStyle(0xffd0d0,1);
  g.fillEllipse(44,45,16,9);
  g.lineStyle(3,0xffcc66,1);
  g.lineBetween(20,53,0,70);
  g.lineBetween(68,53,88,70);
  g.lineStyle(5,0x7b1e1e,1);
  g.lineBetween(74,48,98,60);
  g.generateTexture('rat',100,75);
  // EGG BASE
  g.clear();
  g.fillStyle(0xffffff,1);
  g.fillEllipse(35,45,48,70);
  g.lineStyle(4,0xffcc66,1);
  g.strokeEllipse(35,45,48,70);
  g.generateTexture('eggBase',70,90);
  // BULLET
  g.clear();
  g.fillStyle(0xffff00,1);
  g.fillCircle(10,10,10);
  g.lineStyle(3,0xff6600,1);
  g.strokeCircle(10,10,10);
  g.generateTexture('bullet',20,20);
  // BLOCK
  g.clear();
  g.fillStyle(0x9b1c1c,1);
  g.fillRect(0,0,46,46);
  g.lineStyle(3,0xffcc66,1);
  g.strokeRect(0,0,46,46);
  g.generateTexture('block',46,46);
  g.destroy();
}
function createParisBackground(w,h){
  const g = sceneRef.add.graphics();
  g.fillStyle(0x050000,1);
  g.fillRect(0,0,w,h);
  g.fillStyle(0x140303,1);
  g.fillRect(0,h*0.73,w,h*0.27);
  for(let i=0;i<140;i++){
    g.fillStyle(0xffcc66,Phaser.Math.FloatBetween(0.25,0.95));
    g.fillCircle(
      Phaser.Math.Between(0,w),
      Phaser.Math.Between(110,h-40),
      Phaser.Math.Between(1,3)
    );
  }
  // Art deco frame
  g.lineStyle(4,0xffcc66,0.6);
  for(let i=0;i<5;i++){
    g.strokeRect(18+i*8,140+i*8,w-36-i*16,h-170-i*16);
  }
  // Paris buildings
  for(let i=0;i<20;i++){
    let bw = Phaser.Math.Between(45,90);
    let bh = Phaser.Math.Between(60,170);
    let bx = i*(w/20) + Phaser.Math.Between(-10,15);
    let by = h-90-bh;
    g.fillStyle(0x080808,1);
    g.fillRect(bx,by,bw,bh);
    g.fillStyle(0xffcc66,0.75);
    for(let a=0;a<4;a++){
      for(let b=0;b<3;b++){
        if(Math.random() > 0.35){
          g.fillRect(bx+10+a*16,by+15+b*24,6,9);
        }
      }
    }
  }
  // More real Eiffel-like tower
  const tx = w - 150;
  const baseY = h - 90;
  const topY = 170;
  g.lineStyle(6,0xff2525,1);
  g.beginPath();
  g.moveTo(tx-78,baseY);
  g.lineTo(tx,topY);
  g.lineTo(tx+78,baseY);
  g.strokePath();
  g.lineStyle(4,0xff2525,1);
  g.lineBetween(tx-45,baseY-100,tx+45,baseY-100);
  g.lineBetween(tx-30,baseY-195,tx+30,baseY-195);
  g.lineBetween(tx-18,baseY-270,tx+18,baseY-270);
  g.lineStyle(3,0xffcc66,0.85);
  g.lineBetween(tx-55,baseY-100,tx+55,baseY-100);
  g.lineBetween(tx-35,baseY-195,tx+35,baseY-195);
}
function createUndergroundBackground(w,h){
  const g = sceneRef.add.graphics();
  g.fillStyle(0x020202,1);
  g.fillRect(0,0,w,h);
  g.fillStyle(0x1a0d05,1);
  g.fillRect(0,0,w,h);
  g.lineStyle(6,0x6a3d1a,1);
  for(let y=140;y<h;y+=95){
    g.beginPath();
    g.moveTo(0,y);
    for(let x=0;x<w;x+=80){
      g.lineTo(x+40,y+Phaser.Math.Between(-20,20));
    }
    g.strokePath();
  }
  g.lineStyle(5,0xffcc66,0.5);
  for(let i=0;i<8;i++){
    let x = Phaser.Math.Between(80,w-80);
    g.strokeCircle(x,Phaser.Math.Between(180,h-120),Phaser.Math.Between(35,75));
  }
  g.lineStyle(4,0xffcc66,0.45);
  for(let i=0;i<5;i++){
    g.strokeRect(25+i*9,145+i*9,w-50-i*18,h-185-i*18);
  }
}
function createUI(w,h,underground){
  levelText = sceneRef.add.text(w/2, 35, 'ARTQUEST', {
    fontSize:'40px',
    color:'#ff2a1f',
    fontFamily:'Georgia',
    fontStyle:'bold'
  }).setOrigin(0.5);
  sceneRef.add.text(w/2, 78, 'EGGS IN PARIS', {
    fontSize:'32px',
    color:'#ffcc66',
    fontFamily:'Georgia',
    fontStyle:'bold'
  }).setOrigin(0.5);
  modeText = sceneRef.add.text(w/2, 114, underground ? 'UNDERGROUND LABYRINTH' : 'PARIS STREET LEVEL', {
    fontSize:'18px',
    color:'#ffffff',
    fontFamily:'Arial'
  }).setOrigin(0.5);
  missionText = sceneRef.add.text(w/2, 140, 'Tap anywhere to move. Press SHOOT to stop the Rat Gang.', {
    fontSize:'17px',
    color:'#fff2cc',
    fontFamily:'Arial'
  }).setOrigin(0.5);
  scoreText = sceneRef.add.text(24, 24, 'SCORE: ' + score + '   LEVEL: ' + level + '/100', {
    fontSize:'26px',
    color:'#ffffff',
    fontFamily:'Georgia',
    fontStyle:'bold'
  });
}
function createOstrich(w,h){
  ostrich = sceneRef.physics.add.sprite(150,h/2,'ostrich');
  ostrich.setScale(0.85);
  ostrich.body.setSize(55,95);
  ostrich.setCollideWorldBounds(true);
}
function createEggs(w,h,underground){
  let count = Math.min(8 + Math.floor(level*0.8), 34);
  for(let i=0;i<count;i++){
    spawnEgg(
      Phaser.Math.Between(80,w-230),
      Phaser.Math.Between(165,h-130),
      Phaser.Utils.Array.GetRandom(eggTypes)
    );
  }
}
function spawnEgg(x,y,type){
  let egg = sceneRef.add.container(x,y);
  let sprite = sceneRef.add.sprite(0,0,'eggBase');
  sprite.setTint(type.color);
  sprite.setScale(type.size);
  let label = sceneRef.add.text(0,0,String(type.points),{
    fontSize:'15px',
    color:'#111111',
    fontStyle:'bold'
  }).setOrigin(0.5);
  egg.add(sprite);
  egg.add(label);
  sceneRef.physics.add.existing(egg);
  egg.body.setSize(40*type.size,55*type.size);
  egg.type = type;
  egg.sprite = sprite;
  egg.label = label;
  eggs.push(egg);
}
function createRatGang(w,h){
  let ratCount = Math.min(3 + Math.floor(level/2), 18);
  for(let i=0;i<ratCount;i++){
    let rat = sceneRef.physics.add.sprite(
      Phaser.Math.Between(w*0.45,w*0.82),
      Phaser.Math.Between(170,h-150),
      'rat'
    );
    rat.setScale(0.62);
    rat.body.setCircle(28);
    rat.speed = 70 + level*3 + Phaser.Math.Between(0,35);
    rat.segments = [];
    rat.history = [];
    rat.alive = true;
    for(let s=0;s<2;s++){
      addRatSegment(rat);
    }
    rats.push(rat);
  }
}
function addRatSegment(rat){
  let seg = sceneRef.add.circle(rat.x,rat.y,13,0x8b0000);
  seg.setStrokeStyle(2,0xff6666);
  rat.segments.push(seg);
}
function createShootButton(w,h){
  shootButton = sceneRef.add.graphics();
  shootButton.fillStyle(0x8b0000,0.95);
  shootButton.fillRoundedRect(w-165,h-105,135,72,18);
  shootButton.lineStyle(5,0xffcc66,1);
  shootButton.strokeRoundedRect(w-165,h-105,135,72,18);
  shootLabel = sceneRef.add.text(w-98,h-69,'SHOOT',{
    fontSize:'22px',
    color:'#ffffff',
    fontFamily:'Georgia',
    fontStyle:'bold'
  }).setOrigin(0.5);
}
function update(time){
  if(gamePaused){ return; }
  moveOstrich();
  moveRats();
  updateBullets();
  updateFallingEggs();
  updateBlocks();
  if(time - lastFallingEgg > Math.max(900, 2400 - level*25)){
    lastFallingEgg = time;
    spawnFallingEgg();
  }
  if(time - lastBlock > Math.max(1600, 4200 - level*20)){
    lastBlock = time;
    spawnBlock();
  }
  checkLevelEnd();
}
function moveOstrich(){
  ostrich.body.setVelocity(0);
  if(targetX !== null && targetY !== null){
    const dx = targetX - ostrich.x;
    const dy = targetY - ostrich.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if(dist > 8){
      ostrich.body.setVelocity(dx/dist*260,dy/dist*260);
    }
  }
}
function moveRats(){
  rats.forEach(rat=>{
    if(!rat || !rat.alive || !rat.body){ return; }
    rat.history.unshift({x:rat.x,y:rat.y});
    if(rat.history.length > 200){ rat.history.pop(); }
    let nearest = null;
    let best = 999999;
    eggs.concat(fallingEggs).forEach(egg=>{
      if(!egg || !egg.body){ return; }
      let d = Phaser.Math.Distance.Between(rat.x,rat.y,egg.x,egg.y);
      if(d<best){
        best=d;
        nearest=egg;
      }
    });
    if(nearest){
      let dx = nearest.x-rat.x;
      let dy = nearest.y-rat.y;
      let dist = Math.sqrt(dx*dx+dy*dy);
      if(dist>1){
        rat.body.setVelocity(dx/dist*rat.speed,dy/dist*rat.speed);
      }
    }
    rat.segments.forEach((seg,index)=>{
      let p = rat.history[index*12+8];
      if(p){
        seg.x = p.x;
        seg.y = p.y;
      }
    });
    // rat eats eggs
    eggs.forEach(egg=>{
      if(egg && Phaser.Math.Distance.Between(rat.x,rat.y,egg.x,egg.y)<34){
        ratEatEgg(rat,egg);
      }
    });
    fallingEggs.forEach(egg=>{
      if(egg && Phaser.Math.Distance.Between(rat.x,rat.y,egg.x,egg.y)<34){
        ratEatEgg(rat,egg);
      }
    });
  });
}
function updateBullets(){
  bullets.forEach(bullet=>{
    if(!bullet || !bullet.body){ return; }
    rats.forEach(rat=>{
      if(!rat || !rat.alive){ return; }
      if(Phaser.Math.Distance.Between(bullet.x,bullet.y,rat.x,rat.y)<38){
        bullet.destroy();
        bullets = bullets.filter(b=>b!==bullet);
        damageRat(rat);
      }
    });
    if(bullet.x<0 || bullet.x>sceneRef.scale.width || bullet.y<0 || bullet.y>sceneRef.scale.height){
      bullet.destroy();
      bullets = bullets.filter(b=>b!==bullet);
    }
  });
}
function spawnFallingEgg(){
  const w = sceneRef.scale.width;
  const type = Phaser.Utils.Array.GetRandom(eggTypes);
  let egg = sceneRef.add.container(Phaser.Math.Between(80,w-220), -50);
  let sprite = sceneRef.add.sprite(0,0,'eggBase');
  sprite.setTint(type.color);
  sprite.setScale(type.size);
  let label = sceneRef.add.text(0,0,String(type.points),{
    fontSize:'15px',
    color:'#111111',
    fontStyle:'bold'
  }).setOrigin(0.5);
  egg.add(sprite);
  egg.add(label);
  sceneRef.physics.add.existing(egg);
  egg.body.setSize(40*type.size,55*type.size);
  egg.body.setVelocityY(80 + level*5);
  egg.type = type;
  egg.sprite = sprite;
  egg.label = label;
  fallingEggs.push(egg);
}
function updateFallingEggs(){
  fallingEggs.forEach(egg=>{
    if(!egg || !egg.body){ return; }
    if(Phaser.Math.Distance.Between(ostrich.x,ostrich.y,egg.x,egg.y)<45){
      collectEgg(egg);
    }
    if(egg.y > sceneRef.scale.height + 70){
      egg.destroy();
      fallingEggs = fallingEggs.filter(e=>e!==egg);
    }
  });
  eggs.forEach(egg=>{
    if(egg && Phaser.Math.Distance.Between(ostrich.x,ostrich.y,egg.x,egg.y)<45){
      collectEgg(egg);
    }
  });
}
function spawnBlock(){
  const w = sceneRef.scale.width;
  let block = sceneRef.physics.add.sprite(Phaser.Math.Between(90,w-230),-40,'block');
  block.body.setVelocityY(70 + level*4);
  block.setScale(Phaser.Math.FloatBetween(0.8,1.35));
  blocks.push(block);
}
function updateBlocks(){
  blocks.forEach(block=>{
    if(!block || !block.body){ return; }
    if(block.y > sceneRef.scale.height - 115){
      block.body.setVelocityY(0);
    }
    if(Phaser.Math.Distance.Between(ostrich.x,ostrich.y,block.x,block.y)<55){
      missionText.setText('Tetris block obstacle! Find another path.');
      ostrich.x -= 10;
    }
  });
}
function collectEgg(egg){
  playEggSound();
  if(egg.type.danger){
    score += Math.max(egg.type.points, -20);
    missionText.setText('Danger egg! AORTA Scanner needed!');
  }else{
    score += egg.type.points;
    missionText.setText('Ostrich saved a ' + egg.type.name + ' egg: +' + egg.type.points);
  }
  scoreText.setText('SCORE: ' + score + '   LEVEL: ' + level + '/100');
  egg.destroy();
  eggs = eggs.filter(e=>e!==egg);
  fallingEggs = fallingEggs.filter(e=>e!==egg);
}
function ratEatEgg(rat,egg){
  playRatEatSound();
  if(egg.type.danger){
    missionText.setText('Danger egg destroyed a rat!');
    killRat(rat);
    score += 30;
  }else{
    ratScore += egg.type.points;
    missionText.setText('Rat Gang ate ' + egg.type.name + ' egg. Snake grows!');
    addRatSegment(rat);
    addRatSegment(rat);
  }
  scoreText.setText('SCORE: ' + score + '   LEVEL: ' + level + '/100');
  egg.destroy();
  eggs = eggs.filter(e=>e!==egg);
  fallingEggs = fallingEggs.filter(e=>e!==egg);
}
function shoot(){
  if(Date.now() - lastShot < 300){ return; }
  lastShot = Date.now();
  unlockAudio();
  playShootSound();
  let nearest = null;
  let best = 999999;
  rats.forEach(rat=>{
    if(!rat || !rat.alive){ return; }
    let d = Phaser.Math.Distance.Between(ostrich.x,ostrich.y,rat.x,rat.y);
    if(d<best){
      best=d;
      nearest=rat;
    }
  });
  if(!nearest){ return; }
  let bullet = sceneRef.physics.add.sprite(ostrich.x,ostrich.y,'bullet');
  bullet.body.setCircle(10);
  let dx = nearest.x - ostrich.x;
  let dy = nearest.y - ostrich.y;
  let dist = Math.sqrt(dx*dx+dy*dy);
  bullet.body.setVelocity(dx/dist*650,dy/dist*650);
  bullets.push(bullet);
}
function damageRat(rat){
  playHitSound();
  if(rat.segments.length>0){
    let seg = rat.segments.pop();
    seg.destroy();
    missionText.setText('Rat snake became smaller!');
    score += 15;
  }else{
    killRat(rat);
    score += 40;
  }
  scoreText.setText('SCORE: ' + score + '   LEVEL: ' + level + '/100');
}
function killRat(rat){
  if(!rat || !rat.alive){ return; }
  playPopSound();
  rat.alive = false;
  rat.segments.forEach(s=>s.destroy());
  rat.segments = [];
  for(let i=0;i<12;i++){
    let p = sceneRef.add.circle(rat.x,rat.y,Phaser.Math.Between(3,8),0xff3333);
    sceneRef.tweens.add({
      targets:p,
      x:rat.x+Phaser.Math.Between(-80,80),
      y:rat.y+Phaser.Math.Between(-80,80),
      alpha:0,
      duration:500,
      onComplete:()=>p.destroy()
    });
  }
  rat.destroy();
  rats = rats.filter(r=>r!==rat);
}
function checkLevelEnd(){
  if(gamePaused){ return; }
  if(eggs.length === 0 && fallingEggs.length === 0){
    completeLevel('All eggs secured!');
  }
  if(rats.length === 0){
    completeLevel('Rat Gang defeated!');
  }
  if(ratScore > level * 160){
    completeLevel('Rat Gang escaped with too many eggs!');
  }
}
function completeLevel(text){
  gamePaused = true;
  playLevelSound();
  speakLevelComplete();
  const w = sceneRef.scale.width;
  const h = sceneRef.scale.height;
  levelOverlay = sceneRef.add.container(w/2,h/2);
  let bg = sceneRef.add.rectangle(0,0,Math.min(w-80,620),300,0x000000,0.88);
  bg.setStrokeStyle(5,0xffcc66);
  let title = sceneRef.add.text(0,-80,'LEVEL COMPLETE',{
    fontSize:'38px',
    color:'#ff2a1f',
    fontFamily:'Georgia',
    fontStyle:'bold'
  }).setOrigin(0.5);
  let msg = sceneRef.add.text(0,-20,text,{
    fontSize:'22px',
    color:'#ffffff',
    fontFamily:'Arial'
  }).setOrigin(0.5);
  let next = sceneRef.add.text(0,55,'Ooh là là! Eggs in Paris!\nTap to continue',{
    fontSize:'24px',
    color:'#ffcc66',
    fontFamily:'Georgia',
    align:'center'
  }).setOrigin(0.5);
  levelOverlay.add([bg,title,msg,next]);
  sceneRef.input.once('pointerdown',()=>{
    level++;
    if(level>100){ level = 100; }
    startLevel.call(sceneRef);
  });
}
// AUDIO
let audioCtx;
function unlockAudio(){
  if(audioReady){ return; }
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioReady = true;
  }catch(e){}
}
function tone(freq,duration,type='sine',volume=0.08){
  if(!audioReady || !audioCtx){ return; }
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = volume;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
function playShootSound(){
  tone(180,0.08,'square',0.08);
  setTimeout(()=>tone(90,0.08,'square',0.06),60);
}
function playHitSound(){
  tone(420,0.08,'sawtooth',0.08);
  setTimeout(()=>tone(180,0.06,'sawtooth',0.06),70);
}
function playPopSound(){
  tone(90,0.12,'triangle',0.10);
  setTimeout(()=>tone(50,0.14,'triangle',0.08),100);
}
function playEggSound(){
  tone(660,0.08,'sine',0.08);
  setTimeout(()=>tone(880,0.1,'sine',0.08),80);
}
function playRatEatSound(){
  tone(240,0.08,'square',0.06);
  setTimeout(()=>tone(300,0.08,'square',0.06),90);
}
function playLevelSound(){
  tone(520,0.12,'sine',0.09);
  setTimeout(()=>tone(660,0.12,'sine',0.09),130);
  setTimeout(()=>tone(880,0.16,'sine',0.09),260);
}
function speakLevelComplete(){
  try{
    const phrase = new SpeechSynthesisUtterance('Ooh là là! Eggs in Paris!');
    phrase.lang = 'en-US';
    phrase.rate = 0.9;
    phrase.pitch = 1.1;
    window.speechSynthesis.speak(phrase);
  }catch(e){}
}
